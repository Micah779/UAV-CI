# tells python tools what this project is

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-ci"
version = "0.1.0"
description = "Local-first flight assurance harness for PX4 SITL testing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Micah Aldrich" },
]
dependencies = [
    "mavsdk>=3.17.2,<4",
    "pydantic>=2.13,<3",
    "PyYAML>=6.0.2,<7",
    "pyulog>=1.2.4,<2",
    "protobuf>=7.36.0,<8",
]

[project.scripts]
uav-ci = "uav_ci.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

# look under src/ for packages
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uav_ci.faults" = ["data/*.desc", "data/*.md", "data/*LICENSE*"]

# tests live under tests/
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"